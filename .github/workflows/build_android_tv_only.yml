name: Build Android TV APK Only

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      flutter_version:
        description: 'Flutter version'
        required: false
        default: '3.38.5'
        type: string
      flutter_channel:
        description: 'Flutter channel'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - dev
      split_apks:
        description: 'Split APKs by architecture (release only)'
        required: false
        default: false
        type: boolean
      clean_build:
        description: 'Clean build cache before building'
        required: false
        default: false
        type: boolean

jobs:
  build_tv:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version || '3.38.5' }}
          channel: ${{ github.event.inputs.flutter_channel || 'stable' }}
          cache: true

      - name: Get dependencies
        run: |
          echo "Getting Flutter dependencies..."
          cd simple_live_tv_app && flutter pub get

      - name: Clean build cache
        if: ${{ github.event.inputs.clean_build == 'true' }}
        run: |
          echo "Cleaning build cache..."
          cd simple_live_tv_app && flutter clean && flutter pub get

      - name: Build Android TV APK
        run: |
          echo "Building Android TV APK..."
          
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            echo "Building release APK for Android TV..."
            
            if [ "${{ github.event.inputs.split_apks }}" = "true" ]; then
              echo "Building split APKs by architecture..."
              (cd simple_live_tv_app || exit 1 && flutter build apk --release --split-per-abi)
              ARCH_TYPE="Multi-architecture split"
            else
              echo "Building single APK..."
              (cd simple_live_tv_app || exit 1 && flutter build apk --release)
              ARCH_TYPE="Universal"
            fi
            
            echo "APK build completed successfully!"
            ls -la simple_live_tv_app/build/app/outputs/flutter-apk/ 2>/dev/null || echo "APK directory not found"
            
          else
            echo "Building debug APK for Android TV..."
            (cd simple_live_tv_app || exit 1 && flutter build apk --debug)
            echo "Debug APK build completed successfully!"
            ls -la simple_live_tv_app/build/app/outputs/flutter-apk/ 2>/dev/null || echo "APK directory not found"
            ARCH_TYPE="Universal"
          fi
          
          # Create build info file
          cat > tv_build_info.txt << EOF
          Build Type: ${{ github.event.inputs.build_type || 'debug' }}
          Build Time: $(date)
          Split APKs: ${{ github.event.inputs.split_apks || 'false' }}
          Flutter Version: ${{ github.event.inputs.flutter_version || '3.38.5' }}
          Channel: ${{ github.event.inputs.flutter_channel || 'stable' }}
          Target: Android TV
          Architecture: $ARCH_TYPE
          Project: simple_live_tv_app
          EOF

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-apk-${{ github.event.inputs.build_type || 'debug' }}
          path: |
            simple_live_tv_app/build/app/outputs/flutter-apk/*.apk
            simple_live_tv_app/tv_build_info.txt
          retention-days: 30

      - name: Show APK info
        run: |
          echo "=== Android TV APK Build Summary ==="
          echo "Current directory: $(pwd)"
          echo "Build Type: ${{ github.event.inputs.build_type || 'debug' }}"
          echo "Target: Android TV"
          echo "Flutter Version: ${{ github.event.inputs.flutter_version || '3.38.5' }}"
          echo ""
          
          # 检查目录结构
          echo "Checking directory structure:"
          if [ -d "simple_live_tv_app" ]; then
            ls -la simple_live_tv_app/
          else
            echo "simple_live_tv_app directory not found, checking current directory:"
            ls -la
          fi
          echo ""
          
          # 查找APK文件
          APK_DIR="build/app/outputs/flutter-apk/"
          if [ -d "simple_live_tv_app/$APK_DIR" ]; then
            APK_PATH="simple_live_tv_app/$APK_DIR"
          elif [ -d "$APK_DIR" ]; then
            APK_PATH="$APK_DIR"
          else
            echo "APK directory not found!"
            echo "Available directories:"
            find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
            exit 0
          fi
          
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            echo "Generated APK files:"
            ls -lh "$APK_PATH"*.apk
            echo ""
            echo "APK Size Summary:"
            for apk in "$APK_PATH"*.apk; do
              if [ -f "$apk" ]; then
                size=$(ls -lh "$apk" | awk '{print $5}')
                filename=$(basename "$apk")
                echo "  $filename: $size"
              fi
            done
          else
            echo "Debug APK:"
            ls -lh "$APK_PATH"*.apk
          fi
          
          echo ""
          echo "Build Info:"
          if [ -f "simple_live_tv_app/tv_build_info.txt" ]; then
            cat simple_live_tv_app/tv_build_info.txt
          elif [ -f "tv_build_info.txt" ]; then
            cat tv_build_info.txt
          else
            echo "Build info file not found"
          fi