name: Build Unsigned APK

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-unsigned-apk:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      # 签出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置JAVA环境
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      # 设置Flutter环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: "stable"
          cache: true

      # 安装Android构建依赖
      - name: Install Android dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lib32z1 lib32ncurses6

      # 获取依赖
      - name: Get dependencies
        run: |
          cd simple_live_app
          flutter pub get

      # 构建未签名APK
      - name: Build unsigned APK
        run: |
          cd simple_live_app
          
          if [ "${{ github.event.inputs.build_mode }}" = "release" ]; then
            echo "Building unsigned release APK..."
            flutter build apk --release --no-codesign --split-per-abi
          else
            echo "Building debug APK..."
            flutter build apk --debug
          fi

      # 显示APK信息
      - name: Show APK info
        run: |
          cd simple_live_app
          echo "=== Generated APK files ==="
          find build/app/outputs/flutter-apk -name "*.apk" -exec ls -lh {} \;
          echo ""
          echo "=== APK Details ==="
          find build/app/outputs/flutter-apk -name "*.apk" -exec echo "File: {}" \; -exec file {} \;

      # 上传APK到Artifacts
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-android-apk-${{ github.event.inputs.build_mode }}
          path: |
            simple_live_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      # 创建构建摘要
      - name: Create build summary
        run: |
          cd simple_live_app
          echo "## Android APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Type**: ${{ github.event.inputs.build_mode }}" >> $GITHUB_STEP_SUMMARY
          echo "**Flutter Version**: 3.38.5" >> $GITHUB_STEP_SUMMARY
          echo "**Build Time**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated APK Files" >> $GITHUB_STEP_SUMMARY
          find build/app/outputs/flutter-apk -name "*.apk" -exec ls -lh {} \; | while read line; do
            echo "- $line" >> $GITHUB_STEP_SUMMARY
          done